name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forevertracker
          POSTGRES_PASSWORD: forevertracker_dev
          POSTGRES_DB: forevertracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forevertracker" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://forevertracker:forevertracker_dev@localhost:5432/forevertracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e packages/savedvariables -e "backend[dev]" -e tools/simulator -e "uploader[dev]" lupa
      - name: SavedVariables parser
        run: pytest -q packages/savedvariables/tests
      - name: Addon (Lua 5.1 VM against the mocked client)
        run: pytest -q addon/tests
      - name: Uploader
        run: pytest -q uploader/tests
      - name: Backend, end-to-end and simulation accuracy
        run: pytest -q backend/tests
      - name: Contracts are up to date
        working-directory: backend
        run: |
          python -m app.cli export-schema
          python -m app.cli export-openapi
          git diff --exit-code ../schema ../docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI document
        run: npm run gen:api && git diff --exit-code lib/api-schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t forevertracker-backend:ci .
      - run: docker build -t forevertracker-frontend:ci frontend
