[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forevertracker-simulator"
version = "0.1.0"
description = "Synthetic, development-only ForeverTracker observation generator."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ft-simulate = "forevertracker_sim.cli:main"

[tool.setuptools.packages.find]
include = ["forevertracker_sim*"]
