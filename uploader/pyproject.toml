[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forevertracker-uploader"
version = "0.1.0"
description = "Optional desktop uploader for ForeverTracker SavedVariables. Read-only toward the WoW folder."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "forevertracker-savedvariables"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forevertracker-uploader = "forevertracker_uploader.cli:main"

[tool.setuptools.packages.find]
include = ["forevertracker_uploader*"]
